plugins {
    id 'com.android.application'
}

// Signing is configured from keystore.properties when it exists (the CI job creates it),
// otherwise the release build falls back to the debug key so that a local `assembleRelease`
// still produces an installable APK.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.echidna.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.echidna.studio"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5.0"
    }

    signingConfigs {
        release {
            if (keystoreProps.getProperty('storeFile') != null) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig keystoreProps.getProperty('storeFile') != null
                    ? signingConfigs.release
                    : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    // One APK for real phones: arm64-v8a only. Keeping a single ABI halves the download, and the
    // Live2D core, MediaPipe and ML Kit all ship native code for it. The x86_64 build exists only
    // for the automated emulator job and is asked for explicitly with -PabiX86_64.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            if (project.hasProperty('abiX86_64')) {
                include 'x86_64'
            }
            universalApk false
        }
    }


    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/*.kotlin_module', 'META-INF/AL2.0',
                         'META-INF/LGPL2.1', 'META-INF/DEPENDENCIES', 'META-INF/versions/9/*']
        }
        jniLibs {
            // The MediaPipe and ML Kit natives are already compressed in their AARs; keeping them
            // uncompressed lets the loader map them straight from the APK.
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Live2D Cubism Core (native engine + JNI bindings), vendored in app/libs.
    implementation(name: 'Live2DCubismCore', ext: 'aar')

    // Face tracking for the camera mode, in two layers: MediaPipe Face Landmarker is the precise
    // one (52 blendshape channels plus the head transformation matrix, the same data VTube Studio
    // works with), ML Kit is the fallback in case the MediaPipe runtime cannot start. Both models
    // are bundled in the APK, so the camera works with no network connection.
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'
    implementation 'com.google.mlkit:face-detection:16.1.7'

    testImplementation 'junit:junit:4.13.2'
}
