name: Echidna Studio

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - '.ci/**'
      - 'handoff/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Per commit, so a new push starts at once instead of waiting behind a running build; the first
  # step cancels the older runs of the branch.
  group: echidna-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  BUILD_LOG: ${{ github.workspace }}/ci-out/build.log

jobs:
  build:
    name: Build the arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel the earlier runs of this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow "$GITHUB_WORKFLOW" --branch "$GITHUB_REF_NAME" --limit 30 \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' \
            > /tmp/runs.txt 2>/dev/null || true
          while read -r id; do
            if [ -n "$id" ] && [ "$id" != "$GITHUB_RUN_ID" ]; then
              echo "отменяю прогон $id"
              gh run cancel "$id" || true
            fi
          done < /tmp/runs.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        run: |
          mkdir -p ci-out
          {
            echo "== Echidna Studio =="
            echo "коммит=$GITHUB_SHA ветка=$GITHUB_REF_NAME"
            java -version
          } > "$BUILD_LOG"
          {
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            [ -d "$SDK" ] || SDK=/usr/local/lib/android/sdk
            echo "SDK=$SDK"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
              "$SDKMANAGER" --sdk_root="$SDK" --install "platforms;android-34" "build-tools;34.0.0"
            else
              echo "sdkmanager не найден: $SDKMANAGER"
            fi
            ls "$SDK/platforms" "$SDK/build-tools" || true
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check the sources before the build
        run: |
          {
            python3 tools/check_resources.py .
            python3 tools/check_ui.py .
            python3 tools/check_startup_order.py .
            python3 tools/fix_motion_meta.py --check app/src/main/assets/live2d
            python3 tools/fix_native_alignment.py --check app/libs/Live2DCubismCore.aar
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Fetch the bundled face tracking model
        run: |
          bash tools/fetch_face_model.sh app/src/main/assets/models/face_landmarker.task \
            2>&1 | tee -a "$BUILD_LOG"
          if [ -f app/src/main/assets/models/face_landmarker.task ]; then
            echo "модель трекера в сборке: $(stat -c%s app/src/main/assets/models/face_landmarker.task) байт" \
              | tee -a "$BUILD_LOG"
          else
            echo "МОДЕЛИ ТРЕКЕРА НЕТ: приложение соберётся, но трекером станет ML Kit" | tee -a "$BUILD_LOG"
          fi

      - name: Fetch the bundled body tracking models
        run: |
          bash tools/fetch_pose_model.sh app/src/main/assets/models \
            2>&1 | tee -a "$BUILD_LOG"
          for m in pose_landmarker_full pose_landmarker_lite; do
            if [ -f "app/src/main/assets/models/$m.task" ]; then
              echo "модель позы $m в сборке: $(stat -c%s "app/src/main/assets/models/$m.task") байт" \
                | tee -a "$BUILD_LOG"
            else
              echo "МОДЕЛИ ПОЗЫ НЕТ ($m): тело и руки отслеживаться не будут" | tee -a "$BUILD_LOG"
            fi
          done

      - name: Fetch the bundled 3D character
        run: |
          bash tools/fetch_vrm_model.sh app/src/main/assets/three \
            2>&1 | tee -a "$BUILD_LOG"
          if [ -f app/src/main/assets/three/character.vrm ]; then
            echo "3D модель в сборке: $(stat -c%s app/src/main/assets/three/character.vrm) байт" \
              | tee -a "$BUILD_LOG"
          else
            echo "3D МОДЕЛИ НЕТ: объёмного персонажа в списке не будет" | tee -a "$BUILD_LOG"
          fi

      - name: Check the six characters are in the build
        run: |
          set -o pipefail
          python3 tools/check_tree.py . 2>&1 | tee -a "$BUILD_LOG"

      - name: Set up the signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          {
            if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
              echo "подпись: ключ из секретов репозитория"
              printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
              KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            else
              echo "подпись: постоянный ключ из репозитория (keystore/echidna-release.jks)"
              KEYSTORE_PATH="keystore/echidna-release.jks"
            fi
            if [ ! -f "$KEYSTORE_PATH" ]; then
              echo "КЛЮЧА НЕТ: сборка будет подписана отладочным ключом и не встанет поверх прошлой версии"
              exit 0
            fi
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PATH" \
              "${ANDROID_KEYSTORE_PASSWORD:-echidna-studio}" \
              "${ANDROID_KEY_ALIAS:-echidna}" \
              "${ANDROID_KEY_PASSWORD:-echidna-studio}" > keystore.properties
            echo "keystore.properties готов:"
            sed 's/^\(storePassword=\).*/\1***/; s/^\(keyPassword=\).*/\1***/' keystore.properties
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Run the unit tests
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee -a "$BUILD_LOG"
          {
            echo "=== итог юнит-тестов ==="
            grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
              app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null || true
            grep -h -o 'name="[A-Za-z.]*" tests="[0-9]*"[^>]*' \
              app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null || true
          } > ci-out/unit-tests.log
          cat ci-out/unit-tests.log | tee -a "$BUILD_LOG"
          mkdir -p .ci && cp ci-out/unit-tests.log .ci/unit-tests.log

      - name: Build the release APK (arm64-v8a)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee -a "$BUILD_LOG"

      - name: Collect the handoff artifacts
        run: |
          set -o pipefail
          {
            mkdir -p handoff
            rm -f handoff/*.apk
            VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
            for apk in app/build/outputs/apk/release/*.apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              case "$apk" in
                *arm64*) target="handoff/EchidnaStudio-$VERSION-arm64-v8a.apk" ;;
                *)       target="handoff/EchidnaStudio-$VERSION.apk" ;;
              esac
              cp "$apk" "$target"
            done
            ls -la handoff || true
            echo "=== проверяю содержимое APK ==="
            APK=$(ls handoff/*.apk 2>/dev/null | head -n 1)
            if [ -z "$APK" ]; then
              echo "APK НЕ СОБРАЛСЯ"
              exit 1
            fi
            echo "файл: $APK"
            unzip -l "$APK" | grep -E "lib/|assets/models/|Echidna.moc3" | head -n 15 || true
            echo "нативных библиотек: $(unzip -l "$APK" | grep -cE '[.]so$' || true)"
            echo "архитектуры: $(unzip -l "$APK" | grep -o 'lib/[a-z0-9_-]*/' | sort -u | tr '\\n' ' ')"
            echo "модель трекера внутри: $(unzip -l "$APK" | grep -c 'face_landmarker.task' || true)"
            echo "модели-каталоги в APK: $(unzip -l "$APK" | grep -oE 'assets/live2d/[a-z_]+/model3.json' | sort -u | tr '\n' ' ')"
            echo "модели тела внутри: $(unzip -l "$APK" | grep -c 'pose_landmarker' || true)"
            echo "файлы моделей в APK: $(unzip -l "$APK" | grep -oE 'assets/models/[a-z_]*\.task' | sort -u | tr '\n' ' ')"
            echo "3D модель внутри: $(unzip -l "$APK" | grep -c 'three/character.vrm' || true)"
            echo "Live2D моделей внутри: $(unzip -l "$APK" | grep -c 'model3.json' || true)"
            echo "весит: $(du -h "$APK" | cut -f1)"
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Check Android 8-16 compatibility (4 KB and 16 KB pages)
        run: |
          set -o pipefail
          {
            APK=$(ls handoff/*.apk | head -n 1)
            echo "=== совместимость с Android 8-16 ==="
            python3 tools/check_apk_compat.py "$APK"
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            AAPT=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | head -n 1)
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$APK" 2>/dev/null \
                | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" \
                | sed 's/^/  /' || true
            else
              echo "  aapt2 не найден, версии Android беру из app/build.gradle"
              grep -E "minSdk|targetSdk|compileSdk" app/build.gradle | sed 's/^/  /'
            fi
            echo "=== конец проверки совместимости ==="
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Verify the signature
        run: |
          set -o pipefail
          {
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | head -n 1)
            APK=$(ls handoff/*.apk | head -n 1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK"
            else
              echo "apksigner не найден, проверяю через keytool"
              unzip -p "$APK" META-INF/CERT.RSA > /tmp/cert.rsa 2>/dev/null || true
              ls -la /tmp/cert.rsa 2>/dev/null || true
            fi
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Package the sources into the handoff
        if: always()
        run: |
          set -o pipefail
          {
            mkdir -p handoff
            rm -f handoff/EchidnaStudio-source.zip
            zip -qr handoff/EchidnaStudio-source.zip \
              app/src app/libs app/build.gradle app/proguard-rules.pro \
              build.gradle settings.gradle gradle.properties \
              tools .github README.md Live2D-LICENSE.md keystore.properties
            ls -la handoff || true
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-studio-apk-arm64
          path: handoff/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-studio-source
          path: handoff/EchidnaStudio-source.zip
          if-no-files-found: warn

      - name: Commit the handoff
        if: always()
        run: |
          set -o pipefail
          {
            if [ ! -d handoff ]; then
              echo "handoff пуст"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f handoff
            if git diff --cached --quiet; then
              echo "handoff без изменений"
            else
              git commit -m "handoff: сборка arm64 APK" || true
              git push origin HEAD:${GITHUB_REF_NAME} || true
            fi
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Publish the logs
        if: always()
        run: |
          mkdir -p .ci
          sed -E 's/[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?//g' "$BUILD_LOG" > /tmp/clean.log 2>/dev/null \
            || cp "$BUILD_LOG" /tmp/clean.log
          {
            echo "=== маркеры проблем ==="
            grep -nE "error:|FAILURE:|Execution failed|Caused by:|> Task .*FAILED|Could not (find|resolve|download)|No such file|Exception" /tmp/clean.log | head -n 120 || true
            echo
            echo "=== хвост ==="
            tail -n 400 /tmp/clean.log
          } > .ci/build.log 2>/dev/null || cp /tmp/clean.log .ci/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci || true
          if git diff --cached --quiet; then
            echo "логи без изменений"
          else
            git commit -m "ci: логи сборки" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Echidna Studio: сборка arm64"
            echo
            if grep -q "BUILD SUCCESSFUL" .ci/build.log 2>/dev/null; then
              echo "Сборка APK: **успешно**"
            else
              echo "Сборка APK: **смотри .ci/build.log**"
            fi
            if grep -qE 'tests="[0-9]+" skipped="[0-9]+" failures="0" errors="0"' .ci/unit-tests.log 2>/dev/null; then
              echo "Юнит-тесты логики: **пройдены**"
            else
              echo "Юнит-тесты: **смотри .ci/unit-tests.log**"
            fi
            echo
            echo "| файл | размер |"
            echo "| --- | --- |"
            for f in handoff/*.apk handoff/*.zip; do
              if [ -f "$f" ]; then
                echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
              fi
            done
            echo
            echo "Скачать: вкладка Actions → этот прогон → Artifacts, либо файл в папке \`handoff\`."
          } >> "$GITHUB_STEP_SUMMARY"
