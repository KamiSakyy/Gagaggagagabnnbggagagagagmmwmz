name: Echidna Studio

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - '.ci/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # The group is per ref and per commit, so a new push never waits for a previous run to
  # finish (the emulator step can hang on a bad runner). The first step of the new run
  # cancels the runs that are still going, so one build per branch uses a runner at a time.
  group: echidna-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  BUILD_LOG: ${{ github.workspace }}/ci-out/build.log
  SMOKE_LOG: ${{ github.workspace }}/ci-out/smoke.log
  PKG: com.echidna.studio
  SCREENS: ${{ github.workspace }}/ci-out/screens

jobs:
  build:
    name: Build, test and run on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel the earlier runs of this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "этот прогон: $GITHUB_RUN_ID"
          gh run list --workflow "$GITHUB_WORKFLOW" --branch "$GITHUB_REF_NAME" --limit 30 \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' \
            > /tmp/runs.txt 2>/dev/null || true
          while read -r id; do
            if [ -n "$id" ] && [ "$id" != "$GITHUB_RUN_ID" ]; then
              echo "отменяю прогон $id"
              gh run cancel "$id" || true
            fi
          done < /tmp/runs.txt

      - name: Cancel the earlier runs of this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "этот прогон: $GITHUB_RUN_ID"
          gh run list --workflow "$GITHUB_WORKFLOW" --branch "$GITHUB_REF_NAME" --limit 30 \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' \
            > /tmp/runs.txt 2>/dev/null || true
          while read -r id; do
            if [ -n "$id" ] && [ "$id" != "$GITHUB_RUN_ID" ]; then
              echo "отменяю прогон $id"
              gh run cancel "$id" || true
            fi
          done < /tmp/runs.txt

      - name: Prepare the workspace
        run: |
          mkdir -p ci-out app/libs
          {
            echo "== Echidna Studio build =="
            echo "ветка=$GITHUB_REF_NAME коммит=$GITHUB_SHA"
          } > "$BUILD_LOG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        run: |
          java -version
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" \
              >> "$BUILD_LOG" 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Lint the Android resources
        run: |
          set -o pipefail
          python3 tools/check_resources.py . 2>&1 | tee -a "$BUILD_LOG"

      - name: Fetch the MediaPipe face model
        run: |
          set -o pipefail
          bash tools/fetch_face_model.sh app/src/main/assets/models/face_landmarker.task \
            2>&1 | tee -a "$BUILD_LOG"
          if [ -f app/src/main/assets/models/face_landmarker.task ]; then
            echo "МОДЕЛЬ ТРЕКЕРА В СБОРКЕ"
          else
            echo "ВНИМАНИЕ: модели MediaPipe нет, приложение будет трекать через ML Kit"
          fi | tee -a "$BUILD_LOG"

      - name: Check the bundled assets
        run: |
          set -o pipefail
          {
            echo "--- модель Echidna ---"
            ls app/src/main/assets/live2d/Echidna/ | head -n 5 || true
            echo "мошенов: $(ls app/src/main/assets/live2d/Echidna/motions 2>/dev/null | wc -l)"
            echo "текстур: $(ls app/src/main/assets/live2d/Echidna/textures 2>/dev/null | wc -l)"
            echo "размер модели: $(du -sh app/src/main/assets/live2d | cut -f1)"
            ls app/src/main/assets/models/ 2>/dev/null || echo "модели MediaPipe нет"
            echo "--- нативное ядро Live2D ---"
            unzip -l app/libs/Live2DCubismCore.aar | grep -E "\.so|classes.jar" || true
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Ensure the release signing keystore
        run: |
          set -o pipefail
          {
            if [ ! -f keystore.jks ]; then
              # The keystore is committed, so every build is signed with the same key and a new
              # build installs straight over the previous one. This branch only runs if the file
              # ever goes missing.
              keytool -genkeypair -v -keystore keystore.jks -alias echidna \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass echidnastudio -keypass echidnastudio \
                -dname "CN=Echidna Studio, OU=Echidna, O=Echidna Studio, L=Frankfurt, C=DE"
              printf 'storeFile=keystore.jks\nstorePassword=echidnastudio\nkeyAlias=echidna\nkeyPassword=echidnastudio\n' > keystore.properties
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -f keystore.jks keystore.properties
              git commit -m "ci: recreate the release signing keystore" || true
              git push origin HEAD:${GITHUB_REF_NAME} || true
            fi
            ls -l keystore.jks keystore.properties || true
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Run the unit tests
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee -a "$BUILD_LOG"
          {
            echo "=== итог юнит-тестов ==="
            grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
              app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null || true
            grep -h -o 'name="[A-Za-z.]*" tests="[0-9]*"[^>]*' \
              app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null || true
          } > ci-out/unit-tests.log
          cat ci-out/unit-tests.log | tee -a "$BUILD_LOG"
          mkdir -p .ci && cp ci-out/unit-tests.log .ci/unit-tests.log

      - name: Build the release APKs
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease -PabiX86_64=true 2>&1 | tee -a "$BUILD_LOG"

      - name: Collect the handoff artifacts
        run: |
          set -o pipefail
          {
            mkdir -p handoff
            rm -f handoff/*.apk
            VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
            for apk in app/build/outputs/apk/release/*.apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              case "$apk" in
                *x86_64*) target="handoff/EchidnaStudio-$VERSION-x86_64.apk" ;;
                *arm64*)  target="handoff/EchidnaStudio-$VERSION-arm64-v8a.apk" ;;
                *)        target="handoff/EchidnaStudio-$VERSION.apk" ;;
              esac
              cp "$apk" "$target"
            done
            ls -la handoff || true
            echo "=== содержимое APK ==="
            APK=$(ls handoff/*x86_64*.apk 2>/dev/null | head -n 1)
            if [ -z "$APK" ]; then
              APK=$(ls handoff/*.apk 2>/dev/null | head -n 1)
            fi
            if [ -z "$APK" ]; then
              echo "APK НЕ СОБРАЛСЯ"
              exit 1
            fi
            echo "проверяю $APK"
            unzip -l "$APK" | grep -E "lib/|assets/models|assets/live2d/Echidna/(Echidna.moc3|motions/)" | head -n 20 || true
            echo "нативных библиотек: $(unzip -l "$APK" | grep -c '\.so' || true)"
            echo "модель трекера внутри: $(unzip -l "$APK" | grep -c 'face_landmarker.task' || true)"
            echo "весит: $(du -h "$APK" | cut -f1)"
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Check the emulator acceleration
        run: |
          ls -l /dev/kvm 2>&1 || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          if [ -w /dev/kvm ]; then
            echo "KVM_OK=1" >> "$GITHUB_ENV"
            echo "KVM есть, проверка на эмуляторе пойдёт" | tee -a "$BUILD_LOG"
          else
            echo "KVM_OK=0" >> "$GITHUB_ENV"
            echo "нет /dev/kvm, проверка на эмуляторе будет пропущена" | tee -a "$BUILD_LOG"
          fi

      - name: Run the app on an emulator
        if: env.KVM_OK == '1'
        run: |
          set -o pipefail
          APK=$(ls handoff/*x86_64*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "SMOKE SKIPPED: нет сборки под x86_64"
            exit 0
          fi
          # One step, so the emulator is definitely alive for the test that follows.
          bash tools/start_emulator.sh "system-images;android-30;default;x86_64" 30 \
            2>&1 | tee ci-out/start-emulator.log
          bash tools/smoke_test.sh "$APK" "$SCREENS" 2>&1 | tee "$SMOKE_LOG"

      - name: Save the smoke test report
        if: always()
        run: |
          mkdir -p .ci/screens
          if [ -f ci-out/smoke.log ]; then
            cp ci-out/smoke.log .ci/smoke.log
            cp ci-out/screens/*.png .ci/screens/ 2>/dev/null || true
            {
              echo "=== вердикт ==="
              grep -a -E "SMOKE OK|SMOKE SKIPPED|EMULATOR BOOTED|ИТОГ OK|ПРОВАЛ|ПРИЛОЖЕНИЕ|САМОПРОВЕРКА|ЧАСТЬ КАДРОВ|модель на месте|ПРОВАЛ:" ci-out/smoke.log | head -n 60 || true
              echo "=== камера ==="
              cat ci-out/camera-frames.txt 2>/dev/null || true
            } > .ci/smoke-verdict.log
          else
            echo "проверка на эмуляторе не запускалась" > .ci/smoke.log
            echo "нет отчёта" > .ci/smoke-verdict.log
          fi
          if [ "$(wc -l < .ci/smoke.log)" -gt 400 ]; then
            tail -n 400 .ci/smoke.log > /tmp/smoke-tail.log
            mv /tmp/smoke-tail.log .ci/smoke.log
          fi
          cp ci-out/selftest.txt .ci/selftest.log 2>/dev/null || true
          cp ci-out/start-emulator.log .ci/start-emulator.log 2>/dev/null || true
          wc -l .ci/smoke.log || true

      - name: Package the sources into the handoff
        if: always()
        run: |
          set -o pipefail
          {
            mkdir -p handoff
            rm -f handoff/EchidnaStudio-source.zip
            zip -qr handoff/EchidnaStudio-source.zip \
              app/src app/libs app/build.gradle app/proguard-rules.pro \
              build.gradle settings.gradle gradle.properties \
              tools .github README.md Live2D-LICENSE.md
            ls -la handoff || true
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Upload the APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-studio-apk
          path: handoff/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-studio-screenshots
          path: .ci/screens
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echidna-studio-source
          path: handoff/EchidnaStudio-source.zip
          if-no-files-found: warn

      - name: Commit the handoff
        if: always()
        run: |
          set -o pipefail
          {
            if [ ! -d handoff ]; then
              echo "handoff пуст, коммитить нечего"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f handoff
            if git diff --cached --quiet; then
              echo "handoff без изменений"
            else
              git commit -m "handoff: сборка APK" || true
              git push origin HEAD:${GITHUB_REF_NAME} || true
            fi
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Publish the logs
        if: always()
        run: |
          mkdir -p .ci
          sed -E 's/[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?//g' "$BUILD_LOG" > /tmp/clean.log 2>/dev/null \
            || cp "$BUILD_LOG" /tmp/clean.log
          {
            echo "=== маркеры проблем ==="
            grep -nE "error:|FAILURE:|Execution failed|Caused by:|> Task .*FAILED|Could not (find|resolve|download)|No such file|Exception" /tmp/clean.log | head -n 120 || true
            echo
            echo "=== хвост ==="
            tail -n 400 /tmp/clean.log
          } > .ci/build.log 2>/dev/null || cp /tmp/clean.log .ci/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci || true
          if git diff --cached --quiet; then
            echo "логи без изменений"
          else
            git commit -m "ci: логи сборки" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Echidna Studio"
            echo
            if grep -q "BUILD SUCCESSFUL" .ci/build.log 2>/dev/null; then
              echo "Сборка APK: **успешно**"
            else
              echo "Сборка APK: **смотри .ci/build.log**"
            fi
            if grep -qE 'tests="[0-9]+" skipped="[0-9]+" failures="0" errors="0"' .ci/unit-tests.log 2>/dev/null; then
              echo "Юнит-тесты логики: **пройдены**"
            else
              echo "Юнит-тесты: **смотри .ci/unit-tests.log**"
            fi
            if grep -q "SMOKE OK" .ci/smoke.log 2>/dev/null; then
              echo "Прогон на эмуляторе: **пройден** — модель рисуется во всех режимах, камера работает, самопроверка OK"
            elif grep -q "SMOKE SKIPPED" .ci/smoke.log 2>/dev/null; then
              echo "Прогон на эмуляторе: **пропущен** (нет KVM)"
            elif grep -q "нет отчёта" .ci/smoke.log 2>/dev/null; then
              echo "Прогон на эмуляторе: **не запускался**"
            else
              echo "Прогон на эмуляторе: **не пройден** (смотри .ci/smoke.log)"
            fi
            if grep -q "ИТОГ OK" .ci/selftest.log 2>/dev/null; then
              echo "Самопроверка внутри приложения: **OK**"
            elif [ -f .ci/selftest.log ]; then
              echo "Самопроверка внутри приложения: **провал** (смотри .ci/selftest.log)"
            fi
            echo
            echo "| файл | размер |"
            echo "| --- | --- |"
            for f in handoff/*.apk handoff/*.zip; do
              if [ -f "$f" ]; then
                echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
