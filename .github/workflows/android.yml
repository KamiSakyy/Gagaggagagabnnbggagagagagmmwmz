name: Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - '.ci/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_LOG: ${{ github.workspace }}/ci-out/build.log

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare log
        run: |
          mkdir -p ci-out app/libs
          {
            echo "== build $(date -u +%FT%TZ) =="
            echo "ref=$GITHUB_REF_NAME"
          } > "$BUILD_LOG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -x
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK=/usr/local/lib/android/sdk
            echo "android.sdk.dir=$SDK" > /dev/null
          fi
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
        continue-on-error: false
        env:
          BUILD_LOG: ${{ env.BUILD_LOG }}

      - name: Show toolchain
        run: |
          {
            echo "--- sdkmanager ---"
            which sdkmanager || true
            echo "--- gradle (preinstalled) ---"
            gradle --version || true
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Install missing SDK packages
        run: |
          set -o pipefail
          {
            SDK="${SDK:-/usr/local/lib/android/sdk}"
            if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            elif command -v sdkmanager >/dev/null 2>&1; then
              SM="sdkmanager"
            else
              SM=""
            fi
            if [ -n "$SM" ]; then
              yes | "$SM" --licenses > /dev/null 2>&1 || true
              "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || \
                "$SM" --install "platforms;android-35" "build-tools;35.0.0"
            fi
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fetch sing-box engine (libbox.aar)
        run: |
          set -o pipefail
          {
            mkdir -p app/libs
            curl -fL --retry 6 --retry-delay 5 --retry-all-errors \
              -o app/libs/libbox.aar \
              https://github.com/singbox-android/libbox/releases/download/1.14.1/libbox.aar
            ls -lh app/libs/libbox.aar
            unzip -l app/libs/libbox.aar | grep -E "jni/.+\.so" || true
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Ensure release signing keystore
        run: |
          set -o pipefail
          {
            if [ ! -f keystore.jks ]; then
              keytool -genkeypair -v -keystore keystore.jks -alias vortex \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass vortexvpn -keypass vortexvpn \
                -dname "CN=Vortex VPN, OU=Vortex, O=Vortex, L=Moscow, C=RU"
              printf 'storeFile=keystore.jks\nstorePassword=vortexvpn\nkeyAlias=vortex\nkeyPassword=vortexvpn\n' > keystore.properties
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -f keystore.jks keystore.properties
              git commit -m "ci: add release signing keystore"
              git push origin HEAD:${GITHUB_REF_NAME} || true
            fi
            ls -l keystore.jks keystore.properties
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Validate generated configurations with sing-box
        continue-on-error: true
        run: |
          exec > >(stdbuf -oL tee -a "$BUILD_LOG" /tmp/validation.log) 2>&1
          set -o pipefail
          set -x
          mkdir -p ci-out/cfgcheck
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors -o /tmp/snakeyaml.jar \
            https://repo1.maven.org/maven2/org/yaml/snakeyaml/2.3/snakeyaml-2.3.jar
          javac -cp /tmp/snakeyaml.jar -d ci-out/cfgcheck \
            $(find app/src/main/java/com/vortex/vpn/cfg app/src/main/java/com/vortex/vpn/model app/src/main/java/com/vortex/vpn/sub -name '*.java') \
            tools/ConfigCheck.java
          javac -version
          java -cp ci-out/cfgcheck:/tmp/snakeyaml.jar ConfigCheck ci-out/configs
          echo "harness done"
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors -o /tmp/sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.1/sing-box-1.14.1-linux-amd64.tar.gz
          echo "engine downloaded: $(du -h /tmp/sing-box.tar.gz | cut -f1)"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          ls /tmp | grep -i sing-box || true
          ENGINE=/tmp/sing-box-1.14.1-linux-amd64/sing-box
          chmod +x "$ENGINE"
          echo "engine: $ENGINE"
          "$ENGINE" version
          FAILED=0
          for file in ci-out/configs/*.json; do
            echo "--- check $(basename "$file")"
            if ! "$ENGINE" check -c "$file"; then
              echo "INVALID: $file"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "some configurations were rejected by the engine"
            grep -aE "FATAL|INVALID" /tmp/clean-validation.log 2>/dev/null | head -50 || true
          fi
          # `check` only validates the schema. Some rules (for example "detour to an empty direct
          # outbound makes no sense") are enforced when the engine really starts - that is exactly
          # the failure the user hit when pressing connect. Start every configuration for real,
          # with the TUN inbound replaced by a local proxy port.
          START_FAILED=0
          for file in ci-out/configs/*.json; do
            name=$(basename "$file" .json)
            python3 tools/start_config.py "$file" "/tmp/start-$name.json"
            startlog="/tmp/start-$name.log"
            set +e
            "$ENGINE" run -c "/tmp/start-$name.json" > "$startlog" 2>&1 &
            pid=$!
            started=0
            for i in $(seq 1 20); do
              if grep -aq "sing-box started" "$startlog"; then started=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$started" = "1" ] && kill -0 "$pid" 2>/dev/null; then
              echo "--- start $name: the engine accepted the configuration and is running"
            else
              echo "--- start $name: THE ENGINE REFUSED TO START"
              tail -n 30 "$startlog" || true
              START_FAILED=1
            fi
            kill -INT "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            set -e
          done
          echo "=== configuration check finished (check failed=$FAILED, start failed=$START_FAILED) ==="
          if [ "$START_FAILED" -ne 0 ]; then
            echo "some configurations could not be started by the engine"
            FAILED=$START_FAILED
          fi

      - name: Save configuration check report
        if: always()
        run: |
          mkdir -p .ci
          if [ -f /tmp/validation.log ]; then
            cp /tmp/validation.log .ci/config-check.log
          else
            echo "no validation output" > .ci/config-check.log
          fi
          tail -n 250 .ci/config-check.log > /tmp/tail.log && mv /tmp/tail.log .ci/config-check.log
          wc -l .ci/config-check.log

      - name: Run unit tests on the JVM (Robolectric)
        id: unittests
        if: always()
        run: |
          set -o pipefail
          set +e
          gradle --no-daemon testDebugUnitTest > >(stdbuf -oL tee -a "$BUILD_LOG" /tmp/unit.log) 2>&1
          RC=$?
          set -e
          {
            echo "=== unit test result files ==="
            grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
              app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null || true
            echo "=== gradle exit code: $RC ==="
          } 2>&1 | tee -a /tmp/unit.log
          if [ "$RC" -ne 0 ]; then
            echo "UNIT TESTS FAILED"
            grep -aE "FAILED|Caused by|Exception|error:" /tmp/unit.log | head -n 60 || true
            exit 1
          fi
          echo "unit tests passed"

      - name: Save unit test report
        if: always()
        run: |
          mkdir -p .ci
          if [ -f /tmp/unit.log ]; then
            tr '\r' '\n' < /tmp/unit.log | tail -n 200 > .ci/unit-tests.log
          else
            echo "unit tests did not run" > .ci/unit-tests.log
          fi
          wc -l .ci/unit-tests.log

      - name: Build release APKs
        run: |
          exec > >(stdbuf -oL tee -a "$BUILD_LOG") 2>&1
          set -o pipefail
          EXTRA=""
          if unzip -l app/libs/libbox.aar | grep -q "jni/x86_64/"; then
            EXTRA="-PabiX86_64=true"
            echo "libbox.aar ships x86_64: the emulator ABI is built as well"
          else
            echo "WARNING: libbox.aar has no x86_64 libraries, the emulator smoke test will be skipped"
          fi
          echo "=== gradle assembleRelease $EXTRA ==="
          gradle --no-daemon --stacktrace assembleRelease $EXTRA
          echo "=== gradle finished ==="

      - name: Collect handoff artifacts
        if: always()
        run: |
          set -o pipefail
          {
            set -e
            mkdir -p handoff
            rm -f handoff/*.apk
            find app/build/outputs/apk/release -name '*.apk' -print
            for apk in app/build/outputs/apk/release/*.apk; do
              name=$(basename "$apk")
              case "$name" in
                *arm64*) target="VortexVPN-1.0.0-arm64-v8a.apk" ;;
                *armeabi*) target="VortexVPN-1.0.0-armeabi-v7a.apk" ;;
                *) echo "not published to handoff: $name"; continue ;;
              esac
              cp "$apk" "handoff/$target"
            done
            ls -lh handoff
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Check emulator acceleration
        if: always()
        run: |
          {
            echo "--- kvm ---"
            ls -l /dev/kvm 2>&1 || true
            sudo chmod 666 /dev/kvm 2>/dev/null || true
            if [ -w /dev/kvm ]; then
              echo "KVM_OK=1" >> "$GITHUB_ENV"
              echo "hardware acceleration is available"
            else
              echo "KVM_OK=0" >> "$GITHUB_ENV"
              echo "no usable /dev/kvm: the emulator smoke test will be skipped"
            fi
            nproc
            free -m | head -2
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Run the APK on an Android emulator
        if: always() && env.KVM_OK == '1'
        continue-on-error: true
        env:
          SMOKE_LOG: ${{ github.workspace }}/ci-out/smoke.log
        run: |
          set -o pipefail
          mkdir -p ci-out
          exec > >(stdbuf -oL tee -a "$SMOKE_LOG") 2>&1
          set -x
          SDK="${SDK:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          # cmdline-tools and the emulator must agree where the AVDs live
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          PKG=com.vortex.vpn

          APK=$(ls app/build/outputs/apk/release/*x86_64*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "SMOKE SKIPPED: no x86_64 APK was produced"
            exit 0
          fi

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          AV="$SDK/cmdline-tools/latest/bin/avdmanager"
          [ -x "$AV" ] || AV="$(command -v avdmanager)"
          IMAGE="system-images;android-30;default;x86_64"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "emulator" "$IMAGE" > ci-out/sdkmanager.log 2>&1 || true
          tail -n 3 ci-out/sdkmanager.log || true
          ls "$SDK/emulator/emulator" "$SDK/platform-tools/adb"
          echo no | "$AV" create avd -n smoke -k "$IMAGE" --force || true
          ls -l "$ANDROID_AVD_HOME" || true
          "$SDK/emulator/emulator" -list-avds || true
          if ! "$SDK/emulator/emulator" -list-avds | grep -qx smoke; then
            echo "the emulator cannot see the freshly created AVD"
            exit 1
          fi

          nohup "$SDK/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect -accel auto \
            -camera-back none -camera-front none -verbose > ci-out/emulator.log 2>&1 &
          echo "emulator pid $!"
          adb start-server
          timeout 300 adb wait-for-device || true
          BOOT=""
          for i in $(seq 1 90); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "boot attempt $i: [$BOOT]"
            if [ "$BOOT" = "1" ]; then break; fi
            if [ $((i % 12)) -eq 0 ]; then
              adb devices -l || true
              tail -n 20 ci-out/emulator.log || true
            fi
            sleep 5
          done
          if [ "$BOOT" != "1" ]; then
            echo "EMULATOR FAILED TO BOOT"
            tail -n 120 ci-out/emulator.log || true
            adb devices -l || true
            exit 1
          fi
          adb shell input keyevent 82 || true
          adb logcat -G 16M || true
          echo "EMULATOR BOOTED: android $(adb shell getprop ro.build.version.release | tr -d '\r') $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"

          echo "installing $APK ($(du -h "$APK" | cut -f1))"
          adb install -r -t "$APK"
          adb shell pm list packages | grep "$PKG"
          adb logcat -c || true
          set +e
          adb shell am start -W -n $PKG/.ui.MainActivity > /tmp/start.log 2>&1
          cat /tmp/start.log
          set -e
          if grep -qi "error" /tmp/start.log; then echo "could not start MainActivity"; exit 1; fi
          sleep 12
          echo "--- process after launch ---"
          adb shell pidof "$PKG"
          adb shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus|mFocusedApp" || true
          if adb logcat -d | grep -q "FATAL EXCEPTION"; then
            echo "CRASH DETECTED right after launch"
            adb logcat -d -s AndroidRuntime:E | tail -n 200
            exit 1
          fi
          if ! adb shell pidof "$PKG" > /dev/null; then
            echo "the app is not running after launch"
            adb logcat -d -s AndroidRuntime:E | tail -n 200
            exit 1
          fi

          echo "--- on-device engine self test ---"
          adb shell am force-stop $PKG
          sleep 2
          adb logcat -c || true
          adb shell am start -n $PKG/.ui.MainActivity --ez vortex_selftest true || true
          rm -f ci-out/selftest.txt
          # the report is read from logcat: the shell cannot read /sdcard/Android/data on android 11
          for i in $(seq 1 24); do
            adb logcat -d | grep -a "SELFTEST" > ci-out/selftest.txt || true
            if [ -s ci-out/selftest.txt ]; then break; fi
            sleep 5
          done
          echo "--- self test verdict ---"
          cat ci-out/selftest.txt

          echo "--- opening every screen on the device ---"
          adb shell am force-stop $PKG
          sleep 2
          adb logcat -c || true
          adb shell am start -n $PKG/.ui.MainActivity --ez vortex_screens_audit true || true
          rm -f ci-out/screenaudit.txt
          for i in $(seq 1 24); do
            adb logcat -d | grep -a "SCREENAUDIT" > ci-out/screenaudit.txt || true
            if grep -q "SCREENAUDIT OK" ci-out/screenaudit.txt; then break; fi
            sleep 5
          done
          echo "--- screen audit verdict ---"
          cat ci-out/screenaudit.txt
          if ! grep -q "SCREENAUDIT OK" ci-out/screenaudit.txt; then
            echo "a screen did not survive being opened"
            adb logcat -d -s AndroidRuntime:E | tail -n 200 || true
            adb logcat -d -b crash | tail -n 60 || true
            exit 1
          fi

          echo "--- screenshots of the real app ---"
          adb shell am force-stop $PKG
          sleep 2
          adb shell am start -n $PKG/.ui.MainActivity --ez vortex_demo_servers true || true
          sleep 12
          mkdir -p ci-out/screens
          adb exec-out screencap -p > ci-out/screens/01-dashboard.png || true
          adb shell am start -n $PKG/.ui.ServersActivity || true
          sleep 6
          adb exec-out screencap -p > ci-out/screens/02-locations.png || true
          adb shell am start -n $PKG/.ui.ProfilesActivity || true
          sleep 6
          adb exec-out screencap -p > ci-out/screens/03-profiles.png || true
          adb shell am start -n $PKG/.ui.SettingsActivity || true
          sleep 6
          adb exec-out screencap -p > ci-out/screens/04-settings.png || true
          ls -la ci-out/screens || true
          adb shell am force-stop $PKG
          sleep 2
          adb shell am start -n $PKG/.ui.MainActivity > /dev/null || true
          sleep 8

          echo "--- ui monkey (no --ignore-crashes on purpose) ---"
          adb shell monkey -p $PKG --throttle 300 150 || true
          sleep 3
          if ! adb shell pidof "$PKG" > /dev/null; then
            echo "the app died during the monkey run"
            adb logcat -d -s AndroidRuntime:E | tail -n 200
            exit 1
          fi
          if adb logcat -d | grep -q "FATAL EXCEPTION"; then
            echo "the app crashed (see logcat above)"
            adb logcat -d -s AndroidRuntime:E | tail -n 200
            exit 1
          fi
          if ! grep -q "SELFTEST OK" ci-out/selftest.txt; then
            echo "engine self test did not report OK"
            cat ci-out/selftest.txt || true
            adb logcat -d | grep -a "VortexSelfTest" | tail -n 20 || true
            adb logcat -d -b crash | tail -n 40 || true
            exit 1
          fi
          echo "SMOKE OK: app launched, stayed alive, opened every screen, engine self test passed"

      - name: Save emulator smoke test report
        if: always()
        run: |
          mkdir -p .ci
          if [ -f ci-out/smoke.log ]; then
            cp ci-out/smoke.log .ci/smoke.log
            mkdir -p .ci/screens
            cp ci-out/screens/*.png .ci/screens/ 2>/dev/null || true
            {
              echo "=== verdict ==="
              grep -a -E "SMOKE OK|SMOKE SKIPPED|self test verdict|screen audit verdict|EMULATOR BOOTED|Permission Denial|FATAL|did not" ci-out/smoke.log | head -n 40 || true
              echo "=== app log ==="
              grep -a -E "VortexSelfTest|AndroidRuntime|libbox" ci-out/smoke.log | tail -n 60 || true
            } > .ci/smoke-verdict.log
          else
            echo "the emulator smoke test did not run" > .ci/smoke.log
          fi
          wc -l .ci/smoke.log

      - name: Package sources into handoff
        if: always()
        run: |
          set -o pipefail
          {
            set -e
            rm -f handoff/VortexVPN-source.zip
            zip -qr handoff/VortexVPN-source.zip \
              app/src app/build.gradle app/proguard-rules.pro \
              build.gradle settings.gradle gradle.properties \
              tools .github README.md
            ls -lh handoff
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-vpn-apk
          path: handoff/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-vpn-source
          path: handoff/VortexVPN-source.zip
          if-no-files-found: warn

      - name: Commit handoff into the repository
        if: always()
        run: |
          set -o pipefail
          {
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f handoff
            if git diff --cached --quiet; then
              echo "handoff is up to date"
            else
              git commit -m "handoff: signed APK build ($(date -u +%Y-%m-%dT%H:%MZ))"
              git push origin HEAD:${GITHUB_REF_NAME}
            fi
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Publish build log
        if: always()
        run: |
          mkdir -p .ci
          sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z?//g; s/[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?//g' \
            "$BUILD_LOG" > /tmp/clean.log || cp "$BUILD_LOG" /tmp/clean.log
          {
            echo "=== failure markers ==="
            grep -nE "error:|error;|FAILURE:|Execution failed|Caused by:|What went wrong|> Task .*FAILED|Could not (find|resolve|download)|No such file|not found|failed to|Exception" /tmp/clean.log | head -n 120 || true
            echo
            echo "=== tail ==="
            tail -n 500 /tmp/clean.log
          } > .ci/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/build.log .ci/config-check.log
          [ -d .ci/screens ] && git add -f .ci/screens || true
          [ -f .ci/smoke.log ] && git add -f .ci/smoke.log || true
          [ -f .ci/unit-tests.log ] && git add -f .ci/unit-tests.log || true
          if git diff --cached --quiet; then
            echo "logs unchanged"
          else
            OLD=$(git show HEAD:.ci/build.log 2>/dev/null | sha1sum | cut -d' ' -f1)
            NEW=$(sha1sum .ci/build.log | cut -d' ' -f1)
            echo "old=$OLD new=$NEW"
            if [ "$OLD" != "$NEW" ]; then
              git commit -m "ci: build logs"
              git push origin HEAD:${GITHUB_REF_NAME} || true
            fi
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Vortex VPN build"
            echo
            if grep -q "check failed=0, start failed=0" .ci/config-check.log 2>/dev/null; then
              echo "Configuration validation (every generated config through sing-box 1.14.1:"
              echo "schema check **and** a real engine start): **passed**"
            else
              echo "Configuration validation: **needs attention** (see .ci/config-check.log)"
            fi
            if grep -q "unit tests passed" .ci/unit-tests.log 2>/dev/null; then
              echo "Every screen started on the JVM (Robolectric): **passed**"
            elif grep -q "unit tests did not run" .ci/unit-tests.log 2>/dev/null; then
              echo "Robolectric screen tests: **did not run**"
            else
              echo "Every screen started on the JVM (Robolectric): **failed** (see .ci/unit-tests.log)"
            fi
            if grep -q "SMOKE OK" .ci/smoke.log 2>/dev/null; then
              echo "Launch on a real Android emulator: **passed** (app started, all screens opened, engine self test OK)"
            elif grep -q "SMOKE SKIPPED" .ci/smoke.log 2>/dev/null; then
              echo "Launch on a real Android emulator: **skipped** (no x86_64 engine build)"
            else
              echo "Launch on a real Android emulator: **failed** (see .ci/smoke.log)"
            fi
            echo
            echo "| file | size |"
            echo "| --- | --- |"
            for f in handoff/*.apk handoff/*.zip; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
